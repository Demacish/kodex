name: Android

# The Android app (androidApp/) and the Kotlin it shares (shared/). Gradle never runs on the
# server: this is where the app is built and tested.
on:
  push:
    branches: [main]
    paths:
      - "androidApp/**"
      - "shared/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - "web/openapi.json"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "androidApp/**"
      - "shared/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - "web/openapi.json"
      - ".github/workflows/android.yml"
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Tests, lint, debug and release APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      - name: The shared module against the server's OpenAPI document
        run: ./gradlew --stacktrace :shared:jvmTest
      - name: App unit tests (Robolectric) and lint
        run: ./gradlew --stacktrace --continue :androidApp:testDebugUnitTest :androidApp:lintDebug
      - name: The release signing key
        # From the repository's secrets; without them (a fork's pull request) the release APK
        # is built unsigned, as androidApp/build.gradle.kts allows.
        env:
          KEYSTORE: ${{ secrets.KODEX_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            printf '%s' "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/kodex-release.p12"
            echo "KODEX_KEYSTORE_PATH=$RUNNER_TEMP/kodex-release.p12" >> "$GITHUB_ENV"
          fi
      - name: Debug and release APK
        env:
          KODEX_KEYSTORE_PASSWORD: ${{ secrets.KODEX_KEYSTORE_PASSWORD }}
          KODEX_KEY_ALIAS: ${{ secrets.KODEX_KEY_ALIAS }}
          KODEX_KEY_PASSWORD: ${{ secrets.KODEX_KEY_PASSWORD }}
        run: ./gradlew --stacktrace :androidApp:assembleDebug :androidApp:assembleRelease
      - name: The release APK's signature
        if: env.KODEX_KEYSTORE_PATH != ''
        run: |
          apk=$(ls androidApp/build/outputs/apk/release/*.apk)
          "$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)/apksigner" verify --print-certs "$apk" | grep -i "SHA-256"
          rm -f "$RUNNER_TEMP/kodex-release.p12"
      - uses: actions/upload-artifact@v7
        with:
          name: kodex-android
          path: |
            androidApp/build/outputs/apk/debug/*.apk
            androidApp/build/outputs/apk/release/*.apk
            androidApp/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: android-reports
          path: |
            shared/build/reports
            androidApp/build/reports
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: room-schemas
          path: androidApp/schemas
      - name: The Room schema is committed
        run: |
          if [ -n "$(git status --porcelain androidApp/schemas)" ]; then
            git status --porcelain androidApp/schemas
            echo "::error::The database schema changed: commit the files in the room-schemas artifact (androidApp/schemas)."
            exit 1
          fi

  device:
    name: Reading offline on an emulator
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build the app and its device tests
        run: |
          ./gradlew --stacktrace :androidApp:assembleDebug :androidApp:assembleDebugAndroidTest
          ./gradlew --stop
      # The emulator's userdata partition needs about 7.5 GB, and a runner has about 5.5 GB left
      # after the build: toolchains this job never uses go first (as in Tandem's smoke test).
      - name: Free disk space for the emulator
        run: |
          df -h / | tail -n 1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift /usr/local/share/powershell || true
          df -h / | tail -n 1
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 2
          ram-size: 3072M
          disk-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: ./gradlew --stacktrace :androidApp:connectedDebugAndroidTest
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: device-test-reports
          path: androidApp/build/reports/androidTests
          if-no-files-found: ignore
