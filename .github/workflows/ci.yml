name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Any branch by hand: gh workflow run ci.yml --ref <branch>
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: kodex
          POSTGRES_PASSWORD: kodex
          POSTGRES_DB: kodex_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U kodex -d kodex_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      TEST_DATABASE_URL: postgresql+psycopg://kodex:kodex@localhost:5432/kodex_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: System tools for CBR decoding
        # An apt mirror that hangs once stopped a run for a quarter of an hour.
        timeout-minutes: 5
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends unar libarchive-tools
      - name: kepubify for Kobo sync (as in the image)
        run: |
          curl -fsSL -o /tmp/kepubify https://github.com/pgaskin/kepubify/releases/download/v4.0.4/kepubify-linux-64bit
          echo "37d7628d26c5c906f607f24b36f781f306075e7073a6fe7820a751bb60431fc5  /tmp/kepubify" | sha256sum -c -
          sudo install -m 755 /tmp/kepubify /usr/local/bin/kepubify
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: |
          ruff check . ../tools
          ruff format --check . ../tools
      - name: Type-check
        run: mypy
      - name: Test
        run: python -m pytest -q
      # The API contract (ADR 0013): the committed document is the one the
      # backend describes.
      - name: OpenAPI document is current
        run: python -m kodex.core.openapi ../web/openapi.json && git diff --exit-code ../web/openapi.json

  web:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Client types are current
        run: npm run api && git diff --exit-code src/api/schema.d.ts
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # The whole stack in Docker: images build (the web client inside the api's),
  # the api migrates and becomes healthy, and Playwright drives phase 3's
  # gate through the web client: login, scans, review, every reader, sync.
  compose-smoke:
    runs-on: ubuntu-24.04
    needs: [backend, web]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: tools/check-deploy-templates.sh
      - run: npm ci && npx playwright install --with-deps chromium
        working-directory: web
      - run: tools/smoke-compose.sh
        env:
          PLAYWRIGHT: host
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report
          retention-days: 7
      # The pages before login, photographed by e2e/look.spec.ts.
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: screenshots
          path: web/screenshots
          retention-days: 7
          if-no-files-found: ignore

  commits:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: tools/check-commits.sh "origin/${{ github.base_ref }}..HEAD"

  # The Android app has its own workflow (android.yml).
